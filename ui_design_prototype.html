<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MineClawd ModernUI 界面设计原型</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #0a0a0a, #1a1a1a);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .mineclawd-window {
            width: 900px;
            height: 650px;
            background: linear-gradient(145deg, #1e1e1e, #2a2a2a);
            border-radius: 20px;
            box-shadow: 
                0 25px 50px rgba(0, 0, 0, 0.5),
                0 0 0 1px rgba(255, 255, 255, 0.1);
            overflow: hidden;
            display: flex;
            backdrop-filter: blur(10px);
        }

        /* 侧边栏样式 */
        .sidebar {
            width: 260px;
            background: linear-gradient(180deg, #252525, #1f1f1f);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 24px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #fff;
            font-size: 18px;
            font-weight: 600;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .nav-items {
            flex: 1;
            padding: 20px 0;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 20px;
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
            border-left: 3px solid transparent;
        }

        .nav-item:hover, .nav-item.active {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            border-left-color: #667eea;
        }

        .nav-item.active {
            background: rgba(102, 126, 234, 0.1);
        }

        .nav-icon {
            font-size: 18px;
            width: 24px;
            text-align: center;
        }

        /* 主内容区域 */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .content-header {
            padding: 20px 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .page-title {
            color: #fff;
            font-size: 20px;
            font-weight: 600;
        }

        .window-controls {
            display: flex;
            gap: 8px;
        }

        .control-btn {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        .content-body {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
        }

        /* 卡片样式 */
        .card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .card:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-2px);
        }

        .card-title {
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .card-content {
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.6;
        }

        /* 按钮样式 */
        .btn {
            padding: 12px 24px;
            border-radius: 8px;
            border: none;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 16px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .mineclawd-window {
                width: 95%;
                height: 90vh;
                flex-direction: column;
            }
            
            .sidebar {
                width: 100%;
                height: auto;
            }
        }
    </style>
</head>
<body>
    <div class="mineclawd-window">
        <!-- 左侧导航栏 -->
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <div class="logo-icon">⚒️</div>
                    <span>MineClawd</span>
                </div>
            </div>
            
            <div class="nav-items">
                <div class="nav-item active" onclick="switchTab('chat')">
                    <span class="nav-icon">💬</span>
                    <span>智能对话</span>
                </div>
                <div class="nav-item" onclick="switchTab('tools')">
                    <span class="nav-icon">🔧</span>
                    <span>工具箱</span>
                </div>
                <div class="nav-item" onclick="switchTab('history')">
                    <span class="nav-icon">📚</span>
                    <span>历史记录</span>
                </div>
                <div class="nav-item" onclick="switchTab('settings')">
                    <span class="nav-icon">⚙️</span>
                    <span>设置</span>
                </div>
                <div class="nav-item" onclick="switchTab('plugins')">
                    <span class="nav-icon">🔌</span>
                    <span>插件管理</span>
                </div>
                <div class="nav-item" onclick="switchTab('help')">
                    <span class="nav-icon">❓</span>
                    <span>帮助中心</span>
                </div>
            </div>
        </div>

        <!-- 主内容区域 -->
        <div class="main-content">
            <div class="content-header">
                <div class="page-title" id="pageTitle">智能对话助手</div>
                <div class="window-controls">
                    <button class="control-btn" title="最小化">−</button>
                    <button class="control-btn" title="最大化">□</button>
                    <button class="control-btn" title="关闭" onclick="closeWindow()">×</button>
                </div>
            </div>
            
            <div class="content-body" id="contentBody">
                <!-- 智能对话页面 -->
                <div id="chat-tab" class="tab-content">
                    <div class="card">
                        <div class="card-title">欢迎使用 MineClawd AI 助手</div>
                        <div class="card-content">
                            <p>我是您的 Minecraft 智能助手，可以帮助您：</p>
                            <ul style="margin: 12px 0; padding-left: 20px;">
                                <li>解答游戏相关问题</li>
                                <li>提供建筑和红石建议</li>
                                <li>管理模组和资源包</li>
                                <li>优化游戏性能</li>
                            </ul>
                            <p>请在下方的输入框中输入您的问题...</p>
                        </div>
                        <button class="btn">开始对话</button>
                    </div>
                    
                    <div class="card">
                        <div class="card-title">快速操作</div>
                        <div class="card-content">
                            <div style="display: flex; gap: 12px; flex-wrap: wrap;">
                                <button class="btn" style="margin: 0;">检查模组兼容性</button>
                                <button class="btn" style="margin: 0;">优化游戏设置</button>
                                <button class="btn" style="margin: 0;">备份世界</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 工具箱页面 -->
                <div id="tools-tab" class="tab-content" style="display: none;">
                    <div class="card">
                        <div class="card-title">实用工具</div>
                        <div class="card-content">
                            <p>这里包含各种 Minecraft 实用工具：</p>
                            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-top: 16px;">
                                <div style="background: rgba(255,255,255,0.05); padding: 16px; border-radius: 8px;">
                                    <div style="font-weight: 600; margin-bottom: 8px;">🎮 游戏状态</div>
                                    <div style="font-size: 14px;">查看当前游戏运行状态</div>
                                </div>
                                <div style="background: rgba(255,255,255,0.05); padding: 16px; border-radius: 8px;">
                                    <div style="font-weight: 600; margin-bottom: 8px;">📊 性能监控</div>
                                    <div style="font-size: 14px;">实时监控游戏性能指标</div>
                                </div>
                                <div style="background: rgba(255,255,255,0.05); padding: 16px; border-radius: 8px;">
                                    <div style="font-weight: 600; margin-bottom: 8px;">🔧 模组管理</div>
                                    <div style="font-size: 14px;">管理已安装的模组</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 标签页切换功能
        function switchTab(tabName) {
            // 更新导航激活状态
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active');
            });
            event.currentTarget.classList.add('active');
            
            // 更新页面标题
            const titles = {
                'chat': '智能对话助手',
                'tools': '工具箱',
                'history': '历史记录',
                'settings': '设置',
                'plugins': '插件管理',
                'help': '帮助中心'
            };
            document.getElementById('pageTitle').textContent = titles[tabName];
            
            // 切换内容显示
            document.querySelectorAll('.tab-content').forEach(content => {
                content.style.display = 'none';
            });
            document.getElementById(tabName + '-tab').style.display = 'block';
        }

        // 关闭窗口功能
        function closeWindow() {
            if (confirm('确定要关闭 MineClawd 窗口吗？')) {
                alert('窗口已关闭（实际游戏中会隐藏窗口）');
            }
        }

        // 初始化页面
        document.addEventListener('DOMContentLoaded', function() {
            // 默认显示聊天页面
            switchTab('chat');
        });
    </script>
</body>
</html>
